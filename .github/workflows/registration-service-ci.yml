name: registration-service CI/CD

on:
  push:
    paths:
      - 'backend/registration-service/**'
      - 'backend/city-pulse-common/**'
      - 'backend/pom.xml'
      - '.github/workflows/registration-service-ci.yml'
      - '.github/workflows/common-service-ci.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  call-common-ci:
    uses: ./.github/workflows/common-service-ci.yml
    with:
      service_name: 'registration-service'
      service_path: 'backend/registration-service'
