name: Common Service CI/CD

on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
      service_path:
        required: true
        type: string

jobs:
  build-test-and-publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Determine Version and Tags
        id: vars
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_BASE="ghcr.io/${REPO_OWNER}/city-pulse-${{ inputs.service_name }}"
          
          if [[ "${{ github.event_name }}" == "release" ]]; then
            echo "APP_VERSION=${{ github.ref_name }}" >> $GITHUB_ENV
            echo "DOCKER_TAGS=${IMAGE_BASE}:${{ github.ref_name }}" >> $GITHUB_ENV
          
          elif [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "APP_VERSION=1.0.0-dev.${{ github.run_number }}" >> $GITHUB_ENV
            echo "DOCKER_TAGS=${IMAGE_BASE}:dev-${SHORT_SHA},${IMAGE_BASE}:latest" >> $GITHUB_ENV
          
          else
            CLEAN_TAG=$(echo "${{ github.ref_name }}" | tr '/' '-')
            echo "APP_VERSION=${CLEAN_TAG}-${{ github.run_number }}" >> $GITHUB_ENV
            echo "DOCKER_TAGS=${IMAGE_BASE}:${CLEAN_TAG}" >> $GITHUB_ENV
          fi

      - name: Build application locally
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ~/.m2
          echo '<settings><servers><server><id>github</id><username>'${GITHUB_ACTOR}'</username><password>'${GITHUB_TOKEN}'</password></server></servers></settings>' > ~/.m2/settings.xml
          
          mvn -f backend/pom.xml -N clean install
          mvn -f backend/city-pulse-common/pom.xml clean install -DskipTests
          mvn -f ${{ inputs.service_path }}/pom.xml package -DskipTests -Drevision=${{ env.APP_VERSION }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ inputs.service_path }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.DOCKER_TAGS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
