name: api-gateway CI/CD

on:
  push:
    paths:
      - 'backend/api-gateway/**'
      - 'backend/city-pulse-common/**'
      - 'backend/pom.xml'
  release:
    types: [published]
  workflow_dispatch:

jobs:
  call-common-ci:
    uses: ./.github/workflows/common-service-ci.yml
    with:
      service_name: 'api-gateway'
      service_path: 'backend/api-gateway'
