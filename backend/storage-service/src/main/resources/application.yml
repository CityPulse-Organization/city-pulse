app:
  base-path: /api/${app.api.version}
  api:
    version: ${APP_API_VERSION:v1}
  kafka:
    topics:
      file-deleted: ${KAFKA_TOPIC_FILE_DELETED:file-deleted}

spring:
  application:
    name: storage-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  servlet:
    multipart:
      max-file-size: ${STORAGE_MAX_FILE_SIZE:10MB}
      max-request-size: ${STORAGE_MAX_REQUEST_SIZE:12MB}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:storage-service-group}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.type.mapping: file-deletion:city.pulse.storage.event.FileDeleteRequestEvent

server:
  port: ${APP_PORT:8085}

storage:
  endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
  access-key: ${STORAGE_ACCESS_KEY:dev_minio_user}
  secret-key: ${STORAGE_SECRET_KEY:dev_minio_password}
  bucket: ${STORAGE_BUCKET:citypulse-local-bucket}
  allowed-file-types:
    - image/jpeg
    - image/jpg
    - image/png
    - image/heic
    - image/heif

gcp:
  project-id: ${GCP_PROJECT_ID:}
  client-id: ${GCP_CLIENT_ID:}
  private-key-id: ${GCP_PRIVATE_KEY_ID:}
  private-key: ${GCP_PRIVATE_KEY:}
  client-email: ${GCP_CLIENT_EMAIL:}
  bucket:
    name: ${GCP_BUCKET_NAME:}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:true}

logging:
  level:
    org.apache.kafka: WARN
    org.springframework.kafka: WARN
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-}] "

# ===== OBSERVABILITY =====
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: ${MANAGEMENT_HEALTH_SHOW_DETAILS:always}
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://tempo:4318/v1/traces}

