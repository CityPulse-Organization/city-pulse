app:
  api:
    version: v1
  base-path: /api/${app.api.version}
  kafka:
    topics:
      file-deletion-requests: file-deletion-requests

spring:
  application:
    name: storage-service

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  servlet:
    multipart:
      max-file-size: ${STORAGE_MAX_FILE_SIZE:10MB}
      max-request-size: ${STORAGE_MAX_REQUEST_SIZE:12MB}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: storage-service-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer

server:
  port: ${APP_PORT:8085}

storage:
  allowed-file-types:
    - image/jpeg
    - image/png
    - image/heic
    - image/heif
