app:
  api:
    version: v1
  base-path: /api/${app.api.version}

spring:
  application:
    name: post-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 1
      maximum-pool-size: 3
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000


  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_schema: post_schema
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    default-schema: post_schema
    create-schemas: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${APP_PORT:8082}

services:
  storage:
    url: ${STORAGE_SERVICE_URL:http://storage-service:8085}/api/v1
