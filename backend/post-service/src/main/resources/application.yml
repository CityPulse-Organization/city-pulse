app:
  api:
    version: v1
  base-path: /api/${app.api.version}

spring:
  application:
    name: post-service

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}


  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${APP_PORT:8082}

services:
  storage:
    url: http://storage-service:8085/api/v1
