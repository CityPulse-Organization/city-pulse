app:
  api:
    version: v1
  base-path: /api/${app.api.version}

spring:
  application:
    name: user-service

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://auth-service:8081/api/v1/.well-known/jwks.json
          issuer-uri: http://auth-service:8081

server:
  port: ${APP_PORT:8084}
