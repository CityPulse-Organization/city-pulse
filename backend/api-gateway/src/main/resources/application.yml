server:
  port: 8080

spring:
  application:
    name: api-gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  cloud:
    gateway:
      server:
        webflux:
          routes:
            # --- AUTH SERVICE ---
            - id: auth-service-route
              uri: http://auth-service:8081
              predicates:
                - Path=/api/v1/auth/**, /api/v1/oauth2/**

            - id: auth-service-openapi
              uri: http://auth-service:8081
              predicates:
                - Path=/v3/api-docs/auth
              filters:
                - RewritePath=/v3/api-docs/auth, /v3/api-docs

            # --- REGISTRATION SERVICE ---
            - id: registration-service-route
              uri: http://registration-service:8083
              predicates:
                - Path=/api/v1/registration/**

            - id: registration-service-openapi
              uri: http://registration-service:8083
              predicates:
                - Path=/v3/api-docs/registration
              filters:
                - RewritePath=/v3/api-docs/registration, /v3/api-docs

            # --- POST SERVICE ---
            - id: post-service-route
              uri: http://post-service:8082
              predicates:
                - Path=/api/v1/posts/**, /api/v1/comments/**

            - id: post-service-openapi
              uri: http://post-service:8082
              predicates:
                - Path=/v3/api-docs/post
              filters:
                - RewritePath=/v3/api-docs/post, /v3/api-docs

            # --- USER SERVICE ---
            - id: user-service-route
              uri: http://user-service:8084
              predicates:
                - Path=/api/v1/users/**

            - id: user-service-openapi
              uri: http://user-service:8084
              predicates:
                - Path=/v3/api-docs/user
              filters:
                - RewritePath=/v3/api-docs/user, /v3/api-docs

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: Auth Service
        url: /v3/api-docs/auth

      - name: Registration Service
        url: /v3/api-docs/registration

      - name: Post Service
        url: /v3/api-docs/post

      - name: User Service
        url: /v3/api-docs/user
