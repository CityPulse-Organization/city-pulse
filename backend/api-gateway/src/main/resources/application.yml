server:
  port: ${APP_PORT:8080}

spring:
  config:
    import: "classpath:application-common.yml"
  application:
    name: api-gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_JWK_SET_URI}
          issuer-uri: ${AUTH_ISSUER_URI}

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: mobile-bff-service-route
              uri: ${MOBILE_BFF_SERVICE_URL}
              predicates:
                - Path=/mobile/api/v1/**
            - id: mobile-bff-service-openapi
              uri: ${MOBILE_BFF_SERVICE_URL}
              predicates:
                - Path=/v3/api-docs/mobile-bff
              filters:
                - RewritePath=/v3/api-docs/mobile-bff, /v3/api-docs
            - id: auth-service-route
              uri: ${AUTH_SERVICE_URL}
              predicates:
                - Path=/api/v1/auth/**, /api/v1/oauth2/**
            - id: auth-service-openapi
              uri: ${AUTH_SERVICE_URL}
              predicates:
                - Path=/v3/api-docs/auth
              filters:
                - RewritePath=/v3/api-docs/auth, /v3/api-docs
            - id: post-service-route
              uri: ${POST_SERVICE_URL}
              predicates:
                - Path=/api/v1/posts/**, /api/v1/comments/**
            - id: post-service-openapi
              uri: ${POST_SERVICE_URL}
              predicates:
                - Path=/v3/api-docs/post
              filters:
                - RewritePath=/v3/api-docs/post, /v3/api-docs
            - id: registration-service-route
              uri: ${REGISTRATION_SERVICE_URL}
              predicates:
                - Path=/api/v1/registration/**
            - id: registration-service-openapi
              uri: ${REGISTRATION_SERVICE_URL}
              predicates:
                - Path=/v3/api-docs/registration
              filters:
                - RewritePath=/v3/api-docs/registration, /v3/api-docs
            - id: user-service-route
              uri: ${USER_SERVICE_URL}
              predicates:
                - Path=/api/v1/users/**
            - id: user-service-openapi
              uri: ${USER_SERVICE_URL}
              predicates:
                - Path=/v3/api-docs/user
              filters:
                - RewritePath=/v3/api-docs/user, /v3/api-docs
            - id: storage-service-route
              uri: ${STORAGE_SERVICE_URL}
              predicates:
                - Path=/api/v1/storage/**
            - id: storage-service-openapi
              uri: ${STORAGE_SERVICE_URL}
              predicates:
                - Path=/v3/api-docs/storage
              filters:
                - RewritePath=/v3/api-docs/storage, /v3/api-docs

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: Mobile BFF Service
        url: /v3/api-docs/mobile-bff
      - name: Auth Service
        url: /v3/api-docs/auth
      - name: Post Service
        url: /v3/api-docs/post
      - name: Registration Service
        url: /v3/api-docs/registration
      - name: User Service
        url: /v3/api-docs/user
      - name: Storage Service
        url: /v3/api-docs/storage
