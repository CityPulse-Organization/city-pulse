app:
  base-path: /api/${app.api.version}
  api:
    version: ${APP_API_VERSION:v1}
  kafka:
    topics:
      user-deleted: ${KAFKA_TOPIC_USER_DELETED:user-deleted}
  services:
    auth:
      url: ${AUTH_SERVICE_URL}/api/v1
    user:
      url: ${USER_SERVICE_URL}/api/v1

spring:
  application:
    name: registration-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:registration-service-group}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.type.mapping: user-deleted:city.pulse.registration.event.UserDeletedEvent
        spring.json.trusted.packages: "*"

server:
  port: ${APP_PORT:8083}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:true}

logging:
  level:
    org.apache.kafka: WARN
    org.springframework.kafka: WARN
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-}] "

# ===== OBSERVABILITY =====
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: ${MANAGEMENT_HEALTH_SHOW_DETAILS:always}
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:}

