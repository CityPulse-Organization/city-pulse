app:
  base-path: /api/${app.api.version}
  api:
    version: ${APP_API_VERSION:v1}
  services:
    auth:
      url: ${AUTH_SERVICE_URL}/api/v1
    user:
      url: ${USER_SERVICE_URL}/api/v1

spring:
  application:
    name: registration-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

server:
  port: ${APP_PORT:8083}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:true}
