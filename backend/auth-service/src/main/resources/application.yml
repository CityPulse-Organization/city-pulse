app:
  base-path: /api/${app.api.version}
  api:
    version: ${APP_API_VERSION:v1}
  security:
    jwt:
      ttl:
        access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
        refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:30d}
        temporary-token-ttl: ${JWT_TEMPORARY_TOKEN_TTL:10m}
      active-key-id: ${JWT_ACTIVE_KEY_ID:key-1}
      iss: ${JWT_ISSUER:http://auth-service:8081}
      rotation:
        key-1:
          private-key-path: ${JWT_PRIVATE_KEY_PATH}
          public-key-path: ${JWT_PUBLIC_KEY_PATH}

spring:
  application:
    name: auth-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: ${DB_MIN_IDLE:1}
      maximum-pool-size: ${DB_MAX_POOL_SIZE:3}
      connection-timeout: ${DB_CONNECTION_TIMEOUT:20000}
      idle-timeout: ${DB_IDLE_TIMEOUT:300000}
      max-lifetime: ${DB_MAX_LIFETIME:1200000}

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${OAUTH_GOOGLE_CLIENT_ID:notexists}
            client-secret: ${OAUTH_GOOGLE_CLIENT_SECRET:notexists}

  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:auth_schema}
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:validate}

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    default-schema: ${DB_SCHEMA:auth_schema}
    create-schemas: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${APP_PORT:8081}

logging:
  level:
    org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer: ERROR
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-}] "

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:true}

# ===== OBSERVABILITY =====
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: ${MANAGEMENT_HEALTH_SHOW_DETAILS:always}
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://tempo:4318/v1/traces}

