app:
  base-path: mobile/api/${app.api.version}
  api:
    version: ${APP_API_VERSION:v1}
  services:
    auth:
      url: ${AUTH_SERVICE_URL}/api/v1
    registration:
      url: ${REGISTRATION_SERVICE_URL}/api/v1
    user:
      url: ${USER_SERVICE_URL}/api/v1
    post:
      url: ${POST_SERVICE_URL}/api/v1

spring:
  application:
    name: mobile-bff-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

server:
  port: ${APP_PORT:8086}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:true}

# ===== OBSERVABILITY =====
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: ${MANAGEMENT_HEALTH_SHOW_DETAILS:always}
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://tempo:4318/v1/traces}

logging:
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-}] "

