global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'city-pulse-services'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
    static_configs:
      - targets:
          - 'api-gateway:8080'
          - 'auth-service:8081'
          - 'post-service:8082'
          - 'registration-service:8083'
          - 'user-service:8084'
          - 'storage-service:8085'
          - 'mobile-bff-service:8086'
        labels:
          environment: 'docker'
