services:
  # ==========================================
  # FOUNDATION SERVICES (Depends on Infra)
  # ==========================================
  auth-service:
    image: denys1204/city-pulse-auth-service:${AUTH_SERVICE_VERSION:-latest}
    container_name: city-pulse-auth-service
    expose:
      - "8081"
    networks:
      - city-pulse-network
    env_file:
      - .env-shared
      - .env-auth
    volumes:
      - ./secrets/jwt:/app/secrets/jwt:ro

  # ==========================================
  # 3. INTERMEDIATE SERVICES (Depends on Auth/Infra)
  # ==========================================
  user-service:
    image: denys1204/city-pulse-user-service:${USER_SERVICE_VERSION:-latest}
    container_name: city-pulse-user-service
    expose:
      - "8084"
    networks:
      - city-pulse-network
    depends_on:
      auth-service:
        condition: service_started
    env_file:
      - .env-shared
      - .env-user

  storage-service:
    image: denys1204/city-pulse-storage-service:${STORAGE_SERVICE_VERSION:-latest}
    container_name: city-pulse-storage-service
    expose:
      - "8085"
    networks:
      - city-pulse-network
    depends_on:
      auth-service:
        condition: service_started
    env_file:
      - .env-shared
      - .env-storage

  # ==========================================
  # 4. COMPOSITE SERVICES (Depends on Intermediate)
  # ==========================================
  post-service:
    image: denys1204/city-pulse-post-service:${POST_SERVICE_VERSION:-latest}
    container_name: city-pulse-post-service
    expose:
      - "8082"
    networks:
      - city-pulse-network
    depends_on:
      storage-service:
        condition: service_started
    env_file:
      - .env-shared
      - .env-post

  registration-service:
    image: denys1204/city-pulse-registration-service:${REGISTRATION_SERVICE_VERSION:-latest}
    container_name: city-pulse-registration-service
    expose:
      - "8083"
    networks:
      - city-pulse-network
    depends_on:
      - auth-service
      - user-service
    env_file:
      - .env-shared
      - .env-registration

  # ==========================================
  # 5. BFF / AGGREGATOR SERVICES
  # ==========================================
  mobile-bff-service:
    image: denys1204/city-pulse-mobile-bff-service:${MOBILE_BFF_SERVICE_VERSION:-latest}
    container_name: city-pulse-mobile-bff-service
    expose:
      - "8086"
    networks:
      - city-pulse-network
    depends_on:
      - auth-service
      - registration-service
    env_file:
      - .env-shared

  # ==========================================
  # 6. EDGE / ENTRYPOINT (Depends on everything)
  # ==========================================
  api-gateway:
    image: denys1204/city-pulse-api-gateway:${API_GATEWAY_VERSION:-latest}
    container_name: city-pulse-api-gateway
    ports:
      - "8080:8080"
    networks:
      - city-pulse-network
    depends_on:
      - auth-service
      - post-service
      - registration-service
      - user-service
      - storage-service
      - mobile-bff-service
    env_file:
      - .env-shared
      - .env-gateway

networks:
  city-pulse-network:
    driver: bridge
