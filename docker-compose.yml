services:
  # ==========================================
  # FOUNDATION SERVICES (Depends on Infra)
  # ==========================================
  auth-service:
    image: ghcr.io/citypulse-organization/city-pulse-auth-service:${AUTH_SERVICE_VERSION:-latest}
    container_name: city-pulse-auth-service
    expose:
      - "8081"
    networks:
      - city-pulse-network
    env_file:
      - .env-shared
      - .env-auth
    volumes:
      - ./secrets/jwt:/app/secrets/jwt:ro

  # ==========================================
  # 3. INTERMEDIATE SERVICES (Depends on Auth/Infra)
  # ==========================================
  user-service:
    image: ghcr.io/citypulse-organization/city-pulse-user-service:${USER_SERVICE_VERSION:-latest}
    container_name: city-pulse-user-service
    expose:
      - "8084"
    networks:
      - city-pulse-network
    depends_on:
      auth-service:
        condition: service_started
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    env_file:
      - .env-shared
      - .env-user

  storage-service:
    image: ghcr.io/citypulse-organization/city-pulse-storage-service:${STORAGE_SERVICE_VERSION:-latest}
    container_name: city-pulse-storage-service
    expose:
      - "8085"
    networks:
      - city-pulse-network
    depends_on:
      auth-service:
        condition: service_started
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    env_file:
      - .env-shared
      - .env-storage

  # ==========================================
  # 4. COMPOSITE SERVICES (Depends on Intermediate)
  # ==========================================
  post-service:
    image: ghcr.io/citypulse-organization/city-pulse-post-service:${POST_SERVICE_VERSION:-latest}
    container_name: city-pulse-post-service
    expose:
      - "8082"
    networks:
      - city-pulse-network
    depends_on:
      storage-service:
        condition: service_started
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    env_file:
      - .env-shared
      - .env-post

  registration-service:
    image: ghcr.io/citypulse-organization/city-pulse-registration-service:${REGISTRATION_SERVICE_VERSION:-latest}
    container_name: city-pulse-registration-service
    expose:
      - "8083"
    networks:
      - city-pulse-network
    depends_on:
      auth-service:
        condition: service_started
      user-service:
        condition: service_started
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    env_file:
      - .env-shared
      - .env-registration

  # ==========================================
  # 5. BFF / AGGREGATOR SERVICES
  # ==========================================
  mobile-bff-service:
    image: ghcr.io/citypulse-organization/city-pulse-mobile-bff-service:${MOBILE_BFF_SERVICE_VERSION:-latest}
    container_name: city-pulse-mobile-bff-service
    expose:
      - "8086"
    networks:
      - city-pulse-network
    depends_on:
      - auth-service
      - registration-service
    env_file:
      - .env-shared

  # ==========================================
  # 6. EDGE / ENTRYPOINT (Depends on everything)
  # ==========================================
  api-gateway:
    image: ghcr.io/citypulse-organization/city-pulse-api-gateway:${API_GATEWAY_VERSION:-latest}
    container_name: city-pulse-api-gateway
    ports:
      - "8080:8080"
    networks:
      - city-pulse-network
    depends_on:
      - auth-service
      - post-service
      - registration-service
      - user-service
      - storage-service
      - mobile-bff-service
    env_file:
      - .env-shared
      - .env-gateway

  kafka:
    image: confluentinc/cp-kafka:7.7.0
    container_name: city-pulse-kafka
    env_file:
      - .env-kafka
    ports:
      - "9092:9092"
    networks:
      - city-pulse-network
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  kafka-init:
    image: confluentinc/cp-kafka:7.7.0
    container_name: city-pulse-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - city-pulse-network
    volumes:
      - ./kafka-init.sh:/kafka-init.sh
    command: ["sh", "/kafka-init.sh"]
    restart: "no"

networks:
  city-pulse-network:
    driver: bridge

volumes:
  kafka_data:
